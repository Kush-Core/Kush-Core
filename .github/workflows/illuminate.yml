name: illuminate
on:
  schedule:
    - cron: "17 0 * * *"          # 00:17 UTC = 05:47 IST, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["dist/**", "assets/**"]   # bot commits can't re-trigger
permissions:
  contents: write
concurrency:
  group: illuminate
  cancel-in-progress: false
jobs:
  illuminate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Weave tapestry
        uses: Platane/snk/svg-only@v3   # github_token defaults to the workflow token
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/tapestry-light.svg?color_snake=#B4124A&color_dots=#EBEDF0,#F2D9A6,#E0B25C,#B8862B,#8A5A00
            dist/tapestry-dark.svg?color_snake=#FF4D8D&color_dots=#161B22,#3A2E12,#7A5A12,#C9961E,#FFC94A
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            chronicle/requirements.txt
      - run: pip install -r tools/requirements.txt -r chronicle/requirements.txt
      - name: Rebuild static assets   # picks up edits to tools/ or tokens.json
        run: python tools/build_assets.py
      - run: python -m pytest -q chronicle/tests
      - run: python -m chronicle.render --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Quests abroad (merged open-source PRs)
        run: python -m chronicle.quests --user "${{ github.repository_owner }}" --out dist --readme README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist assets README.md
          git diff --cached --quiet || { git commit -m "chore(dist): re-illuminate"; git push; }
